<main class="pkwrap"><section class="list-hero noprint"><h1>ポケモン英単語プリント</h1><p>レベルを選んで「作る」を押し、印刷するだけ。解答つき・無料</p></section>
<section class="card noprint"><div class="ctrl"><label>レベル <select id="lv"><option value="chu1">中学1年</option><option value="chu2" selected>中学2年</option><option value="chu3">中学3年</option><option value="kou">高校</option><option value="dai">大学・難関</option></select></label>
<label>問題数 <select id="n"><option>10</option><option selected>16</option><option>20</option></select></label><button id="make">🎲 作る</button><button class="sub" onclick="print()">🖨️ 印刷する</button></div>
<p style="font-size:14px;margin-top:10px">「作る」を押すたびに問題が入れかわります。2ページ目に解答がつきます。家庭学習や授業でご自由にお使いください。</p></section>
<div id="out"></div>
<p class="noprint"><a href="words.html">📚 レベル別の英単語一覧 →</a></p></main>
<script>
const LVN={chu1:"中学1年",chu2:"中学2年",chu3:"中学3年",kou:"高校",dai:"大学・難関"};let DATA=null;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(){const lv=document.getElementById("lv").value,n=+document.getElementById("n").value;
 const pool=shuffle(DATA[lv].slice()).filter(x=>x[4].length<140);const half=Math.ceil(n/2);const a=pool.slice(0,half),b=pool.slice(half,n);
 const today=new Date().toLocaleDateString("ja-JP");
 let q='<div class="sheet"><h2>ポケモン英単語プリント（'+LVN[lv]+'）</h2><div class="meta"><span>'+today+'</span><span>名前（　　　　　　　　　）　　　／ '+n+'点</span></div>';
 q+='<h3>1. 英単語の意味を日本語で書こう</h3><div class="q1">'+a.map((x,i)=>'<div>('+(i+1)+') <b lang="en">'+esc(x[0])+'</b>　</div>').join("")+'</div>';
 q+='<h3>2. ポケモン図鑑の文の（　）に入る英単語を書こう</h3><ol class="q2">'+b.map(x=>{const re=new RegExp("\\b"+x[0]+"\\b","i");return '<li lang="en">'+esc(x[4]).replace(re,'<span class="bl"></span>')+'<br><small>ヒント '+esc(x[1])+'（'+x[0][0]+'から始まる）・'+esc(x[5])+'の図鑑より</small></li>'}).join("")+'</ol>';
 q+='<p class="foot">英語版ポケモン図鑑の文章を使ったプリントです　poketango.com ／ ©Nintendo/Creatures Inc./GAME FREAK inc.</p></div>';
 let s='<div class="sheet ans"><h2>解答</h2><h3>1.</h3><div class="q1">'+a.map((x,i)=>'<div>('+(i+1)+') '+esc(x[0])+' … <b>'+esc(x[1])+'</b></div>').join("")+'</div><h3>2.</h3><ol class="q2">'+b.map(x=>'<li><b lang="en">'+esc(x[0])+'</b>（'+esc(x[1])+'）</li>').join("")+'</ol></div>';
 document.getElementById("out").innerHTML=q+s;}
fetch("wordlist.json").then(r=>r.json()).then(d=>{DATA=d;make()});document.getElementById("make").onclick=make;
</script>
