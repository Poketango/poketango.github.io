<div id="mode-bar">
    <button data-mode="normal">ノーマル</button>
    <button data-mode="noja">日本語なし</button>
    <button data-mode="sec10">10秒サバイバル</button>
    <button data-mode="ta60">60秒タイムアタック</button>

</div>
<button id="sound-btn" type="button" aria-label="効果音のオン・オフ" title="効果音のオン・オフ">🔊</button>
<div id="main">
    <div id="start-screen">
        <div id="ss-icon">🔥</div>
        <h2 id="ss-name">ノーマル</h2>
        <p id="ss-desc"></p>
        <p id="ss-best"></p>
        <p id="ss-rank" style="display:none"></p>
        <button id="start-btn" type="button" disabled>読みこみ中…</button>
        <p class="ss-hint">ほかのモードは上のボタンで切り替えられます</p>
    </div>
    <div id="timer-wrap" style="display:none"><div id="timer-bar"></div><span id="timer-text"></span></div>
    <div id="question-box">
        <img id="poke-img" src="" alt="pokemon image">
        <p id="desc"></p>

        <div class="answer-row">
            <input id="answer-input" placeholder="答えを入力してEnter" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="check-answer-btn">答え合わせ</button>
        </div>

        <p id="desc-ja"></p>

        <p id="ta-flash"></p>
        <p id="judge"></p>
        <p id="combo">現在の連続正解数：0</p>
        <p id="best">最高記録：0</p>
    </div>
</div>

<!-- ★ main の外に移動する！ -->
<div id="gameover-box" style="display:none; padding:30px; max-width:900px; margin:0 auto;">

    <div id="fail-flex" style="display:flex; gap:20px; align-items:flex-start;">

        <!-- 左：画像 -->
        <div id="fail-left" style="width:180px; text-align:center;">
            <img id="fail-poke-img" src="" style="width:180px; border-radius:10px;">
        </div>

        <!-- 右：説明 + 不正解情報 -->
        <div id="fail-right" style="flex:1;">

            <!-- 英語説明 -->
            <p id="fail-desc-en" style="font-size:14px; margin-bottom:10px;"></p>

            <!-- 日本語説明 -->
            <p id="fail-desc-ja" style="font-size:14px; margin-bottom:15px;"></p>

            <!-- 不正解情報 -->
            <p id="fail-title" style="font-size:28px; font-weight:bold; color:#d9534f; margin:5px 0;"></p>
            <p id="fail-answer" style="font-size:22px; font-weight:bold; margin:5px 0;"></p>
            <p id="fail-combo" style="font-size:20px; margin:5px 0;"></p>

            <p id="final-score" style="font-size:18px; margin:5px 0;"></p>
            <p id="best-score" style="font-size:18px; margin:10px 0 20px;"></p>

        </div>

    </div>

    <!-- ボタン類 -->
    <div style="text-align:center; margin-top:20px;">
        <button id="retry-btn" style="padding:12px 25px; font-size:18px; margin:10px;">もう一度挑戦する <kbd class="key-hint">Space</kbd></button>
        <button id="home-btn" onclick="location.href='index.html'" style="padding:12px 25px; font-size:18px; margin:10px;">ホームへ戻る <kbd class="key-hint">Esc</kbd></button>
